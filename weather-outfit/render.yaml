# Render.com 배포 설계도(Blueprint). Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래대로 만들어진다.
# 데이터(SQLite)는 영구 디스크 /data 에 저장돼 재배포해도 남는다. (디스크는 유료 플랜 필요)
services:
  - type: web
    name: nalssi-server
    runtime: docker
    plan: starter
    rootDir: weather-outfit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_BASE_URL
        sync: false            # 배포 후 생기는 주소 (예: https://nalssi-server.onrender.com) 를 넣는다
      - key: JWT_SECRET
        generateValue: true    # 32자 이상 임의 문자열 자동 생성
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false            # 공공데이터포털 인증키 (대시보드에서 직접 입력)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false            # 12자 이상
      - key: ALLOW_DEV_LOGIN
        value: "true"          # 소셜 로그인 키를 넣기 전까지만 켜 둔다 (테스트 로그인)
      - key: KAKAO_REST_API_KEY
        sync: false
